# Flatpak manifest for CompressX (Smart-Compress).
#
# Like the .rpm, Arch package and AppImage, this repackages the installed
# tree of the .deb that CI builds, so the Flatpak ships the same binary as
# every other format instead of a second build inside the sandbox. The
# workflow unpacks that tree into packaging/flatpak/tree/ after bundle-tools.sh
# added ffmpeg, Ghostscript and qpdf (from Ubuntu 24.04) under
# usr/lib/smart-compress/tools/: the app runs them for video, audio and PDF
# work, and the sandbox cannot reach the host's copies. A Flathub submission
# needs `tree` swapped for an archive source and the tools built as modules;
# see README.md in this directory.
id: com.dhivalabs.smartcompress
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: smart-compress
finish-args:
  # GTK needs a display socket; fallback-x11 covers X11-only desktops.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Flutter's renderer.
  - --device=dri
  # The compressed copy is written next to the original by default, and
  # dragged-in files arrive as paths; both need the folders themselves, which
  # the file chooser portal does not grant.
  - --filesystem=home
modules:
  - name: smart-compress
    buildsystem: simple
    build-options:
      # Stripping the Flutter AOT snapshot (libapp.so) leaves an app that
      # cannot start, and the Ubuntu tools are stripped already.
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: tree
        dest: tree
      - type: file
        path: com.dhivalabs.smartcompress.metainfo.xml
    build-commands:
      # Flutter finds lib/ and data/ next to its executable. The tools go on
      # PATH (/app/bin), where the app looks for them with `which`.
      - install -d /app/lib && cp -a tree/usr/lib/smart-compress /app/lib/smart-compress
      - install -d /app/bin && ln -s ../lib/smart-compress/smart_compress /app/bin/smart-compress
      - for t in ffmpeg gs qpdf; do ln -s ../lib/smart-compress/tools/bin/$t /app/bin/$t; done
      - install -Dm644 tree/usr/share/applications/smart-compress.desktop /app/share/applications/com.dhivalabs.smartcompress.desktop
      - desktop-file-edit --set-icon=com.dhivalabs.smartcompress --set-key=Exec --set-value='smart-compress' /app/share/applications/com.dhivalabs.smartcompress.desktop
      - install -Dm644 tree/usr/share/icons/hicolor/256x256/apps/smart-compress.png /app/share/icons/hicolor/256x256/apps/com.dhivalabs.smartcompress.png
      - install -Dm644 tree/usr/share/icons/hicolor/512x512/apps/smart-compress.png /app/share/icons/hicolor/512x512/apps/com.dhivalabs.smartcompress.png
      - install -Dm644 com.dhivalabs.smartcompress.metainfo.xml /app/share/metainfo/com.dhivalabs.smartcompress.metainfo.xml
