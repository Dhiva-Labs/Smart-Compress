# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with tool/build_deb.sh.

NAME=smart-compress
APP_NAME=Smart-Compress
GITHUB_REPO=Dhiva-Labs/Smart-Compress
TAG_PREFIX=v
SUMMARY='CompressX: offline file compressor and converter'
DESCRIPTION='Offline-first file compressor and converter. Compress images, PDFs, video, audio and archives entirely on-device. No uploads, no ads, no tracking.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/Smart-Compress
# The repository has no licence file, so no open-source licence is granted.
LICENSE=LicenseRef-Proprietary
LICENSE_FILE=''

# lib/libdartjni.so comes from the jni plugin (pulled in by the Android
# plugins). CMake found the runner's JDK, so it links libjvm.so with a RUNPATH
# into that JDK; no distribution resolves it, and the desktop app never loads
# it. No new format ships it.
EXCLUDE=(usr/lib/smart-compress/lib/libdartjni.so)
PACKAGE_EXCLUDE=()

# rpm: shared-library dependencies are worked out from the ELF files. Video,
# audio and PDF work runs ffmpeg, Ghostscript and qpdf when they are there
# (the app shows how to install them otherwise), as the .deb's Recommends.
RPM_REQUIRES=()
RPM_RECOMMENDS=(/usr/bin/ffmpeg /usr/bin/gs /usr/bin/qpdf)
ARCH_DEPENDS=(gtk3)
ARCH_OPTDEPENDS=('ffmpeg: video and audio compression' 'ghostscript: PDF compression' 'qpdf: PDF merging')
ARCH_INDEPENDENT=0

APPIMAGE=1
EXEC=usr/lib/smart-compress/smart_compress
DESKTOP=usr/share/applications/smart-compress.desktop
ICON=usr/share/icons/hicolor/512x512/apps/smart-compress.png
APPRUN_ENV=''

# Smoke test in each distribution container. The GTK runner shows its window
# only after Flutter rendered the first frame, so a visible "CompressX"
# window proves the AOT snapshot ran.
GUI_CMD=smart-compress
GUI_WINDOW='^CompressX$'
SMOKE_SECONDS=90
SMOKE_CMD=''
