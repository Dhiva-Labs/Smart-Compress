name: Desktop builds

# Builds, tests and packages the Linux and Windows desktop apps, each on a
# native runner: Flutter cannot cross-compile either desktop target, so every
# architecture is built on a machine of that architecture. The Android APK is
# not built here.
#
# The distros, aur and flatpak jobs repackage the Linux .deb for Fedora/RHEL/
# openSUSE (.rpm), Arch (.pkg.tar.zst and the AUR PKGBUILD), any glibc
# distribution (AppImage) and Flatpak, and install and run each one on the
# real distribution.
#
# Every run keeps the packages as workflow artifacts. When a GitHub release is
# published, the release job attaches the packages of both architectures to it
# and skips every asset the release already has.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release Smart Compress is developed with (Dart ^3.12.2). There
  # are no Flutter SDK archives for linux-arm64 or windows-arm64, so every leg
  # installs the SDK the same way: a shallow clone of the release tag.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the installed .deb.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in smart_compress lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      - name: Package tarball and .deb
        run: |
          tool/build_tarball.sh dist
          tool/build_deb.sh
          # build_deb.sh stages the package tree in dist/deb/.
          rm -rf dist/deb

      - name: Check the packages
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          NAME="smart-compress-linux-${{ matrix.arch }}"
          DEB="dist/smart-compress_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 2 ]
          tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP"
          file "$RUNNER_TEMP/$NAME/smart_compress" | grep "$ELF_MACHINE"
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y --no-install-recommends "./$DEB"
          file /usr/lib/smart-compress/smart_compress | grep "$ELF_MACHINE"

      # Starts the installed app under Xvfb. The GTK runner shows its window
      # only when Flutter has rendered the first frame, so a visible "CompressX"
      # window means the AOT snapshot ran on this architecture.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          smart-compress > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --onlyvisible --name '^CompressX$' > /dev/null 2>&1; then
              echo "CompressX window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "smart-compress died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "smart-compress exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no visible CompressX window after 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_DIR: build\windows\${{ matrix.arch }}\runner\Release
      # PE COFF machine of every .exe/.dll, and ELF e_machine of the AOT
      # snapshot (data\app.so is an ELF file on Windows too).
      PE_MACHINE: ${{ matrix.pe_machine }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # On an ARM64 host (PROCESSOR_ARCHITECTURE=ARM64) the bootstrap fetches
      # the arm64 Dart SDK and `flutter build windows` targets windows-arm64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"

      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Assert every PE file is ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $files = Get-ChildItem -Path $env:RELEASE_DIR -Recurse -File -Include *.exe, *.dll
          if (-not ($files.Name -contains 'smart_compress.exe') -or -not ($files.Name -contains 'flutter_windows.dll')) {
            throw "smart_compress.exe or flutter_windows.dll missing from $env:RELEASE_DIR"
          }
          $bad = 0
          foreach ($f in $files) {
            $m = Get-PeMachine $f.FullName
            '{0,-50} 0x{1:X4}' -f $f.Name, $m
            if ($m -ne $expected) { Write-Host "::error file=$($f.FullName)::machine 0x$('{0:X4}' -f $m), expected $env:PE_MACHINE"; $bad++ }
          }
          $bytes = [IO.File]::ReadAllBytes("$env:RELEASE_DIR\data\app.so")
          $elf = [BitConverter]::ToUInt16($bytes, 0x12)
          'data\app.so ELF e_machine 0x{0:X2}' -f $elf
          if ($elf -ne [Convert]::ToUInt16($env:ELF_MACHINE, 16)) { Write-Host "::error::app.so is not $env:ELF_MACHINE"; $bad++ }
          "checked $($files.Count) PE files and app.so"
          if ($bad) { exit 1 }

      # The runner shows its window only when Flutter has rendered the first
      # frame (MainWindowHandle is 0 until then), so a window means the AOT
      # snapshot ran on this architecture.
      - name: Smoke-run the release build
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "$env:RELEASE_DIR\smart_compress.exe" -PassThru
          $up = $false
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "smart_compress.exe exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0) {
              "window '$($p.MainWindowTitle)' is up after ${i}s"
              $up = $true
              break
            }
          }
          if (-not $up) {
            Stop-Process -Id $p.Id -Force
            throw "no window after 90 s (window handle $($p.MainWindowHandle))"
          }
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "smart_compress.exe died after showing its window (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Package zip
        run: ./tool/package_windows.ps1 -OutDir dist

      - name: Check the package
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $zipName = "smart-compress-windows-$env:ARCH"
          Get-ChildItem dist | Format-Table Name, Length
          if ((Get-ChildItem dist).Count -ne 1) { throw 'expected exactly one zip in dist' }
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$zipName.zip"))
          try {
            $entry = $zip.GetEntry("$zipName/smart_compress.exe")
            if (-not $entry) { throw "$zipName/smart_compress.exe not in the zip" }
            $tmp = Join-Path $env:RUNNER_TEMP 'zip_smart_compress.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
            $m = Get-PeMachine $tmp
            'zip: {0} entries, smart_compress.exe 0x{1:X4}' -f $zip.Entries.Count, $m
            if ($m -ne $expected) { throw 'zip holds the wrong architecture' }
          } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), then installs
  # every one of them on the real distribution and runs it. The Flatpak's
  # tree also gets ffmpeg, Ghostscript and qpdf (bundle-tools.sh), which the
  # other formats take from the system.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      # ffmpeg, ghostscript, qpdf and patchelf: bundle-tools.sh copies the
      # first three (and their libraries) into the Flatpak's tree.
      - name: Install nfpm, appimagetool and the tools for the Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript qpdf patchelf
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          dpkg-deb -x "deb/smart-compress_${VERSION}_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree-app.tar" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      # The AppImage's tree plus the tools; tar keeps modes and symlinks,
      # which a plain artifact upload would drop.
      - name: Add ffmpeg, Ghostscript and qpdf to the Flatpak's tree
        run: |
          mkdir "$RUNNER_TEMP/flatpak-tree"
          tar -xf "$RUNNER_TEMP/tree-app.tar" -C "$RUNNER_TEMP/flatpak-tree"
          packaging/flatpak/bundle-tools.sh "$RUNNER_TEMP/flatpak-tree"
          tar -C "$RUNNER_TEMP/flatpak-tree" -cf "$RUNNER_TEMP/tree.tar" .

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar
          if-no-files-found: error
          retention-days: 3

  # AUR recipe: PKGBUILD + .SRCINFO for smart-compress-bin, rendered with
  # this build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: debs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh debs/*_amd64.deb debs/*_arm64.deb dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Builds the Flatpak bundle from the distros job's tree, installs it in the
  # builder container, makes the bundled tools do the app's jobs inside the
  # sandbox (check-tools.sh) and runs the app.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xf "$RUNNER_TEMP/tree.tar" -C packaging/flatpak/tree
          echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.smartcompress.yml
          bundle: smart-compress-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          arch: ${{ matrix.fp_arch }}
          artifact-name: flatpak-${{ matrix.arch }}
          cache: false

      - name: Install the bundle and run it
        env:
          SANDBOX_TOOLS: which xdg-open
          SANDBOX_TEST: packaging/flatpak/check-tools.sh
        run: |
          packaging/flatpak/test-bundle.sh \
            smart-compress-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak \
            com.dhivalabs.smartcompress '^CompressX$'

  release:
    name: Release assets
    needs: [linux, windows, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'windows-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES=""
          for arch in x64 arm64; do
            FILES="$FILES assets/smart-compress-linux-${arch}.tar.gz assets/smart-compress-windows-${arch}.zip"
          done
          FILES="$FILES assets/smart-compress_${VERSION}_amd64.deb assets/smart-compress_${VERSION}_arm64.deb"
          for a in x86_64 aarch64; do
            FILES="$FILES assets/smart-compress-${VERSION}-1.${a}.rpm"
            FILES="$FILES assets/smart-compress-${VERSION}-1-${a}.pkg.tar.zst"
            FILES="$FILES assets/Smart-Compress-${VERSION}-${a}.AppImage"
            FILES="$FILES assets/smart-compress-${VERSION}-${a}.flatpak"
          done
          FILES="$FILES assets/smart-compress-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Skips an asset when the release already has it (matched by name), so a
      # hand-uploaded file always wins and nothing is overwritten.
      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            if grep -qxF "$(basename "$f")" <<< "$existing"; then
              echo "$(basename "$f") is already attached to $TAG, leaving it alone"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
